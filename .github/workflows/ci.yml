name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Prepare Miri
        run: cargo miri setup
      - name: Check core unsafe code with Miri
        run: cargo miri test --package nylon-ring --lib

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check minimum supported Rust version
        run: cargo check --workspace --all-targets --all-features

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Package core crate
        run: cargo package --package nylon-ring
      - name: Package host crate
        run: cargo package --package nylon-ring-host --config 'patch.crates-io.nylon-ring.path="crates/nylon-ring"'
      - name: Validate foreign ABI examples
        run: |
          cc -std=c11 -Wall -Wextra -Werror -shared -fPIC examples/c-plugin/plugin.c -o /tmp/libnylon_ring_c_example.so
          c++ -std=c++17 -Wall -Wextra -Werror -shared -fPIC examples/cpp-plugin/plugin.cpp -o /tmp/libnylon_ring_cpp_example.so
          go build -C examples/go-plugin -buildmode=c-shared -o /tmp/libnylon_ring_go_example.so
          zig build-lib -dynamic -O ReleaseFast -femit-bin=/tmp/libnylon_ring_zig_example.so examples/zig-plugin/plugin.zig
