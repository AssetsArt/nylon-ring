name: Publish crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify release
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"

          if [[ "${{ github.event_name }}" == "release" ]]; then
            release_version="${GITHUB_REF_NAME#v}"
            if [[ "$release_version" != "$version" ]]; then
              echo "Release tag $GITHUB_REF_NAME does not match workspace version $version" >&2
              exit 1
            fi
          fi

          cargo test --workspace --all-targets --all-features
          cargo publish --dry-run --package nylon-ring

      - name: Publish crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.RUST_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "Organization secret RUST_TOKEN is unavailable to this repository" >&2
            exit 1
          fi

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          user_agent="nylon-ring GitHub Actions (${GITHUB_REPOSITORY})"

          version_exists() {
            curl --fail --silent --show-error \
              --header "User-Agent: $user_agent" \
              "https://crates.io/api/v1/crates/$1/$version" >/dev/null
          }

          if version_exists nylon-ring; then
            echo "nylon-ring $version is already published; skipping"
          else
            cargo publish --package nylon-ring
          fi

          for attempt in $(seq 1 30); do
            if version_exists nylon-ring; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "nylon-ring $version did not become available on crates.io" >&2
              exit 1
            fi
            sleep 10
          done

          if version_exists nylon-ring-host; then
            echo "nylon-ring-host $version is already published; skipping"
          else
            cargo publish --package nylon-ring-host
          fi
